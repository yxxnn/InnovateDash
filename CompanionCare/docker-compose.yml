services:
  db:
    image: postgres:16-alpine
    container_name: companioncare_db
    environment:
      POSTGRES_USER: companioncare
      POSTGRES_PASSWORD: companioncarepw
      POSTGRES_DB: companioncare
      TZ: Asia/Singapore
    ports:
      - "5432:5432"
    volumes:
      - companioncare_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companioncare -d companioncare"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: companioncare_backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: companioncare
      DB_PASSWORD: companioncarepw
      DB_NAME: companioncare
      TZ: Asia/Singapore
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: companioncare_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  companioncare_data:
